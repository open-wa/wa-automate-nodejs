name: Release

on:
  push:
    branches: [release]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: Release
    env:
      # The release only builds and publishes packages — it never needs a
      # browser. Skip the Puppeteer Chromium download during install/build.
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Plan release
        id: plan
        run: pnpm exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build packages for publish
        if: steps.plan.outputs.mode == 'publish'
        run: pnpm build

      - name: Create version PR or publish to npm
        if: steps.plan.outputs.mode != 'nothing'
        run: pnpm exec bumpy ci release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.CUSTOM_GH_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.plan.outputs.mode == 'publish'
        run: ./tools/release/publish-github-packages.sh
        env:
          BUMPY_PACKAGES: ${{ steps.plan.outputs.packages }}
          GITHUB_TOKEN: ${{ github.token }}

      # ── Post-publish: Get version ────────────────────────────────
      - name: Get published version
        if: steps.plan.outputs.mode == 'publish' && contains(fromJSON(steps.plan.outputs.packages), '@open-wa/core')
        id: version
        run: |
          VERSION=$(jq -r .version packages/core/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

      # ── Post-publish: Generate release notes ─────────────────────
      - name: Generate release notes
        if: steps.plan.outputs.mode == 'publish' && contains(fromJSON(steps.plan.outputs.packages), '@open-wa/core')
        run: pnpm tsx tools/release/generate-notes.ts --version ${{ steps.version.outputs.version }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # ── Post-publish: Generate release image ─────────────────────
      # The image is rendered with Puppeteer/Chrome, but the job skips the
      # Chromium download (PUPPETEER_SKIP_DOWNLOAD) to keep install/build lean,
      # so fetch a browser here just for this cosmetic step. Both this install
      # and the render are continue-on-error: a missing release image must
      # never block the actual GitHub Release / Discord notification (the
      # Create GitHub Release step already handles an absent release.png).
      - name: Install Chrome for release image
        if: steps.plan.outputs.mode == 'publish' && contains(fromJSON(steps.plan.outputs.packages), '@open-wa/core')
        continue-on-error: true
        env:
          PUPPETEER_SKIP_DOWNLOAD: '0'
        run: npx puppeteer browsers install chrome

      - name: Generate release image
        if: steps.plan.outputs.mode == 'publish' && contains(fromJSON(steps.plan.outputs.packages), '@open-wa/core')
        continue-on-error: true
        run: node tools/release-image.js --version ${{ steps.version.outputs.version }}

      # ── Post-publish: Create GitHub Release ──────────────────────
      - name: Create GitHub Release
        if: steps.plan.outputs.mode == 'publish' && contains(fromJSON(steps.plan.outputs.packages), '@open-wa/core')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # Use release notes if available, otherwise a default
          NOTES_FILE="RELEASE_BODY.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "# @open-wa v${VERSION}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Release v${VERSION}" >> "$NOTES_FILE"
          fi

          # Determine if this is a pre-release
          PRE_FLAG=""
          if echo "$VERSION" | grep -qE "alpha|beta|rc|pre"; then
            PRE_FLAG="--prerelease"
          fi

          # Create the release
          RELEASE_ARGS=(
            "$TAG"
            --title "$TAG"
            --notes-file "$NOTES_FILE"
            $PRE_FLAG
          )

          # Attach release image if it exists
          if [ -f "release.png" ]; then
            gh release create "${RELEASE_ARGS[@]}" release.png
          else
            gh release create "${RELEASE_ARGS[@]}"
          fi

          echo "✅ GitHub Release created: $TAG"

      # ── Post-publish: Discord notification ───────────────────────
      - name: Notify Discord
        if: steps.plan.outputs.mode == 'publish' && contains(fromJSON(steps.plan.outputs.packages), '@open-wa/core')
        run: pnpm tsx tools/release/discord-notify.ts --version ${{ steps.version.outputs.version }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
