name: Effect runtime contracts

on:
  pull_request:
    # Pull requests into master only. The release promotion pull request
    # (master into release) is opened with the Actions token, so GitHub holds
    # its runs for approval; it merges before anyone approves them, and they
    # end as failures with no jobs. Those commits are checked by the push run.
    branches: [master]
    paths:
      - 'packages/runtime-*/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/config/**'
      - 'packages/wa-automate/**'
      - 'integrations/**'
      - 'architecture/benchmarks/effect-replacements.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tools/check-effect-pins.mjs'
      - 'tools/check-effect-evidence.mjs'
      - 'tools/check-portable-imports.mjs'
      - 'tools/check-bun-runtime.ts'
      - 'tools/bench-effect-startup.mjs'
      - '.github/workflows/effect-contracts.yml'
  push:
    branches: [master]
    # Everything the check builds on or runs, so a change to any of it is checked.
    paths:
      - 'packages/runtime-*/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/config/**'
      - 'packages/wa-automate/**'
      - 'integrations/**'
      - 'architecture/benchmarks/effect-replacements.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tools/check-effect-pins.mjs'
      - 'tools/check-effect-evidence.mjs'
      - 'tools/check-portable-imports.mjs'
      - 'tools/check-bun-runtime.ts'
      - 'tools/bench-effect-startup.mjs'
      - '.github/workflows/effect-contracts.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: pnpm check:effect-contracts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun tools/check-bun-runtime.ts
