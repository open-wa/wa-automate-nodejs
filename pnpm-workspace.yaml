shamefullyHoist: true
nodeLinker: hoisted
strictPeerDependencies: false
lockfile: true
# NOTE: node-red previously skipped puppeteer's browser download via a
# per-project .npmrc. Set PUPPETEER_SKIP_DOWNLOAD=1 in the environment for
# installs that must skip the shared hoisted Puppeteer browser download.
allowBuilds:
  '@lightpanda/browser': true
  '@swc/core': true
  # bcrypt is only pulled in (nested) by node-red-admin, whose ancient
  # node-pre-gyp build fails on modern Node; node-red tooling falls back to
  # bcryptjs when the native module is unavailable.
  bcrypt: false
  cloudflared: true
  core-js: true
  deasync: true
  esbuild: true
  fast-folder-size: true
  gifsicle: true
  highlight.js: true
  jpegtran-bin: true
  optipng-bin: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unix-dgram: true
  workerd: true
  '@open-wa/wa-automate': false
  '@firebase/util': false
  '@scarf/scarf': false
  msw: false
  unrs-resolver: false
  vue-demi: false
  # optional native accelerator for msgpackr; JS fallback is sufficient
  msgpackr-extract: false
