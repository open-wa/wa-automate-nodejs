version: "3.9"
services:

  owa:
    image: openwa/wa-automate:latest # Docker Hub currently publishes only latest; pin the npm release separately.
    hostname: owa
    init: true
    restart: on-failure
    volumes:
      - "sessions:/sessions"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WA_DISABLE_SPINS: 'true' # See supported environment variables: https://openwa.dev/docs/guides/config-secrets
      WA_SESSION_ID: "MY_SESSION" # Change this
      WA_PORT: "8080"
      WA_USER_DATA_DIR: /sessions/MY_SESSION
      WA_API_KEY: ${WA_API_KEY:?Set WA_API_KEY in .env before starting}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sessions:
