<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" role="img" aria-labelledby="title desc">
<title id="title">Voxtral in Neo's normal Chat feed</title>
<desc id="desc">Wireframe with sample content: the existing Chat list and timeline contain voice-note transcripts, Voxtral replies, live call turns, and per-chat pause and takeover controls. The plugin page holds settings and usage.</desc>
